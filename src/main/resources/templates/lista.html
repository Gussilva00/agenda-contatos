<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agenda de Contatos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #4a4a8a; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        a.btn { padding: 6px 12px; text-decoration: none; border-radius: 4px; margin-right: 5px; }
        a.btn-novo { background-color: #4a4a8a; color: white; display: inline-block; margin-bottom: 15px; }
        a.btn-editar { background-color: #f0a500; color: white; }
        a.btn-excluir { background-color: #d9534f; color: white; }
        .vazio { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <h1>📒 Agenda de Contatos</h1>
    <a href="/contatos/novo" class="btn btn-novo">+ Novo Contato</a>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(contatos)}">
                <td colspan="4" class="vazio">Nenhum contato cadastrado ainda.</td>
            </tr>
            <tr th:each="contato : ${contatos}">
                <td th:text="${contato.nome}"></td>
                <td th:text="${contato.telefone}"></td>
                <td th:text="${contato.email}"></td>
                <td>
                    <a th:href="@{/contatos/editar/{id}(id=${contato.id})}" class="btn btn-editar">Editar</a>
                    <a th:href="@{/contatos/excluir/{id}(id=${contato.id})}" class="btn btn-excluir"
                       onclick="return confirm('Deseja excluir este contato?')">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Contato</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type=text] { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        button.btn { background-color: #4a4a8a; color: white; margin-top: 20px; font-size: 15px; }
        a.btn-voltar { background-color: #888; color: white; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>📝 Cadastrar / Editar Contato</h1>

    <form action="/contatos/salvar" method="post" th:object="${contato}">
        <input type="hidden" th:field="*{id}" />

        <label>Nome:</label>
        <input type="text" th:field="*{nome}" placeholder="Ex: João Silva" />

        <label>Telefone:</label>
        <input type="text" th:field="*{telefone}" placeholder="Ex: (81) 99999-9999" />

        <label>Email:</label>
        <input type="text" th:field="*{email}" placeholder="Ex: joao@email.com" />

        <br/>
        <button type="submit" class="btn">💾 Salvar</button>
    </form>

    <br/>
    <a href="/contatos" class="btn btn-voltar">← Voltar</a>
</body>
</html>
